services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: threats
      POSTGRES_USER: threat_app
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # выполняется только при первом создании тома базы данных
      - ./db/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat_app -d threats"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://threat_app:local_dev_password@db:5432/threats?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
