openapi: 3.0.0
info:
  title: Information Exchange Service
  description: API для хранения и обмена информацией об известных угрозах по MD5.
  version: 1.1.0
paths:
  /info/{md5}:
    parameters:
      - $ref: '#/components/parameters/Md5Path'
    get:
      operationId: getInfoByMd5
      summary: Получить информацию об угрозе по MD5
      responses:
        '200':
          description: Угроза найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateThreat
      summary: Обновить запись по MD5
      description: |
        MD5 идентифицирует существующую запись и не изменяется.
        Изменение name перепривязывает MD5 к указанной угрозе.
        Переданные description, severity и threat_type обновляют общую
        информацию о названии угрозы, видимую для всех привязанных MD5.
        Если угроза с таким name отсутствует, создаётся новая запись справочника.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatUpdateRequest'
      responses:
        '200':
          description: Запись обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /info:
    post:
      operationId: createThreat
      summary: Добавить новый MD5 и информацию об угрозе
      description: |
        MD5 должен быть уникальным. name может повторяться у разных MD5.
        Если название уже известно, берутся сохранённые общие метаданные.
        Если переданные метаданные противоречат существующим, возвращается 409.
        Не переданные общие поля при создании нового названия получают значения
        по умолчанию: description='', severity='unknown', threat_type='other'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatCreateRequest'
      responses:
        '201':
          description: Запись создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      operationId: getHealth
      summary: Проверить, что HTTP-сервер работает
      responses:
        '200':
          description: Сервер отвечает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
components:
  parameters:
    Md5Path:
      name: md5
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{32}$'
      description: MD5-хеш файла (32 шестнадцатеричных символа)
      example: d41d8cd98f00b204e9800998ecf8427e
  schemas:
    Severity:
      type: string
      enum: [unknown, low, medium, high, critical]
      default: unknown
    ThreatType:
      type: string
      enum: [other, trojan, worm, ransomware, spyware]
      default: other
    ThreatMetadata:
      type: object
      properties:
        description:
          type: string
          maxLength: 2048
          example: Вредоносная программа, похищающая данные
        severity:
          $ref: '#/components/schemas/Severity'
        threat_type:
          $ref: '#/components/schemas/ThreatType'
    ThreatCreateRequest:
      type: object
      additionalProperties: false
      required: [md5, name]
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          example: d41d8cd98f00b204e9800998ecf8427e
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Trojan.Win32.Generic
        description:
          type: string
          maxLength: 2048
        severity:
          $ref: '#/components/schemas/Severity'
        threat_type:
          $ref: '#/components/schemas/ThreatType'
    ThreatUpdateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Trojan.Win32.Generic
        description:
          type: string
          maxLength: 2048
        severity:
          $ref: '#/components/schemas/Severity'
        threat_type:
          $ref: '#/components/schemas/ThreatType'
    ThreatResponse:
      type: object
      required: [md5, name, description, severity, threat_type, created_at, updated_at]
      properties:
        md5:
          type: string
          pattern: '^[a-f0-9]{32}$'
        name:
          type: string
        description:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        threat_type:
          $ref: '#/components/schemas/ThreatType'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [message, details]
      properties:
        message:
          type: string
        details:
          type: string
  responses:
    BadRequest:
      description: Некорректные данные запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Запись с таким MD5 не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: MD5 уже существует или общие метаданные противоречат сохранённым
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
